# /etc/nginx/bx/settings/auth_basic_map.conf — подключается в http {} через include bx/settings/*.conf
# нужен для тестового, в проде не переносить

map $uri $auth_realm {
    default "Private Test Site";

    # публичные API
    ~^/api(/|$)            off;   # nuxt api
    ~^/bitrix/api(/|$)     off;   # bitrix api

    # служебные пути Nuxt и файлы
    ~^/_ipx/               off;
    ~^/_nuxt/              off;
    ~^/upload/             off;
}