# /etc/nginx/bx/settings/ipx-cache.conf — подключается в http {} через include bx/settings/*.conf
# Зона кеша готовых картинок Nuxt Image (ipx), используется в bx/conf/bitrix-nuxt.conf (location /_ipx/).
# Каталог: mkdir -p /var/cache/nginx/ipx && chown bitrix:bitrix (nginx работает от bitrix).
# Сброс после выката, если менялись файлы в nuxt/public/images: rm -rf /var/cache/nginx/ipx/* (необязательно — живёт 1 час).
proxy_cache_path /var/cache/nginx/ipx levels=1:2 keys_zone=ipx:10m max_size=512m inactive=30d use_temp_path=off;
